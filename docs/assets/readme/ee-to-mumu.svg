46.17 106.5 L 347.73 103.94 L 349.3 103 L 350.87 103.94 L 352.43 106.5 L 354 110" class="feynman-diagram__edge feynman-diagram__edge--photon" /><g class="feynman-diagram__edge-group"><path d="M 354 110 L 438 52" class="feynman-diagram__edge feynman-diagram__edge--fermion" /><path d="M 388.32 86.3 L 402.97 82.87 L 396.72 73.82 Z" class="feynman-diagram__arrow" /></g><g class="feynman-diagram__edge-group"><path d="M 354 110 L 438 168" class="feynman-diagram__edge feynman-diagram__edge--fermion" /><path d="M 403.68 144.3 L 389.03 140.87 L 395.28 131.82 Z" class="feynman-diagram__arrow" /></g><text aria-label="e-" dominant-baseline="middle" text-anchor="end" y="168" x="62" class="feynman-diagram__label feynman-diagram__label--incoming"><tspan>e</tspan><tspan font-size="82%" baseline-shift="super">−</tspan></text><text aria-label="e+" dominant-baseline="middle" text-anchor="end" y="52" x="62" class="feynman-diagram__label feynman-diagram__label--incoming"><tspan>e</tspan><tspan font-size="82%" baseline-shift="super">+</tspan></text><text aria-label="μ+" dominant-baseline="middle" text-anchor="start" y="52" x="458" class="feynman-diagram__label feynman-diagram__label--outgoing"><tspan>μ</tspan><tspan font-size="82%" baseline-shift="super">+</tspan></text><text aria-label="μ-" dominant-baseline="middle" text-anchor="start" y="168" x="458" class="feynman-diagram__label feynman-diagram__label--outgoing"><tspan>μ</tspan><tspan font-size="82%" baseline-shift="super">−</tspan></text><text aria-label="γ" dominant-baseline="middle" text-anchor="middle" y="78" x="260" class="feynman-diagram__label feynman-diagram__label--edge"><tspan>γ</tspan></text><g class="feynman-diagram__momentum-label"><path d="M 207.36 129 L 312.64 129" class="feynman-diagram__momentum-arrow" /><path d="M 317.97 129 L 309.97 132.5 L 309.97 125.5 Z" class="feynman-diagram__arrow feynman-diagram__momentum-arrowhead" /><text aria-label="k" dominant-baseline="middle" text-anchor="middle" y="149" x="260" class="