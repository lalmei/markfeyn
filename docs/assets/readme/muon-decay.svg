<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" style="--feynman-diagram-width: 460px;" aria-labelledby="feynman-title-0" viewBox="-12 -12 484 304" height="304" width="484" role="img" class="feynman-diagram__svg"><style>
      .feynman-diagram {
        margin: 1.25rem 0;
        overflow-x: auto;
      }

      .feynman-diagram__svg {
        display: block;
        width: min(100%, var(--feynman-diagram-width, 46rem));
        max-width: 46rem;
        height: auto;
        color: var(--md-typeset-color, #1f2933);
      }

      .feynman-diagram__edge {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.6;
      }

      .feynman-diagram__edge--scalar {
        stroke-dasharray: 7 6;
      }

      .feynman-diagram__edge--gluon {
        stroke-width: 2.1;
      }

      .feynman-diagram__edge--ghost {
        stroke-dasharray: 1 7;
      }

      .feynman-diagram__edge--dashed {
        stroke-dasharray: 10 7;
      }

      .feynman-diagram__edge--dashdot {
        stroke-dasharray: 11 6 1 6;
      }

      .feynman-diagram__edge--double {
        stroke-width: 2.1;
      }

      .feynman-diagram__junction-cap {
        fill: currentColor;
        stroke: none;
      }

      .feynman-diagram__brace {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.6;
      }

      .feynman-diagram__brace--tex {
        fill: currentColor;
        stroke: none;
      }

      .feynman-diagram__momentum-arrow {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.4;
      }

      .feynman-diagram__arrow,
      .feynman-diagram__vertex--dot,
      .feynman-diagram__vertex--square-dot {
        fill: currentColor;
      }

      .feynman-diagram__vertex {
        stroke: currentColor;
        stroke-width: 2.3;
      }

      .feynman-diagram__vertex--empty-dot {
        fill: var(--md-default-bg-color, #fff);
      }

      .feynman-diagram__vertex-backdrop {
        fill: var(--markfeyn-diagram-bg, var(--md-default-bg-color, #fff));
        stroke: none;
      }

      .feynman-diagram__vertex--blob {
        stroke-width: 2.8;
      }

      .feynman-diagram__vertex--blob-shaded {
        fill: currentColor;
        fill-opacity: 0.14;
      }

      .feynman-diagram__vertex--blob-hatched {
        fill-opacity: 1;
      }

      .feynman-diagram__hatch-fill {
        fill: currentColor;
        fill-opacity: 0.08;
        stroke: none;
      }

      .feynman-diagram__hatch-line {
        fill: none;
        stroke: currentColor;
        stroke-linecap: square;
        stroke-opacity: 0.55;
        stroke-width: 1.35;
      }

      .feynman-diagram__vertex-mark {
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 2.4;
      }

      .feynman-diagram__label {
        fill: currentColor;
        font-family: "Latin Modern Math", "Latin Modern Roman", "Computer Modern Serif", "CMU Serif", "STIX Two Text", "Times New Roman", serif;
        font-size: 32px;
        font-style: italic;
      }

      .feynman-diagram__label--edge {
        font-size: 26px;
      }

      .feynman-diagram__label--brace {
        font-size: 26px;
      }

      .feynman-diagram__label--fallback {
        opacity: 0.92;
      }

      .feynman-diagram__label--mathjax {
        fill: currentColor;
      }

      .feynman-diagram__errors {
        color: var(--md-code-hl-special-color, #b00020);
        font-size: 0.75rem;
        margin-top: 0.25rem;
      }

      .feynman-diagram--loading {
        min-height: 9rem;
      }
    </style><title id="feynman-title-0">Feynman diagram</title><rect fill="#ffffff" rx="12" height="304" width="484" y="-12" x="-12" /><defs><marker markerUnits="strokeWidth" orient="auto" refY="4" refX="7" markerHeight="11" markerWidth="11" id="feynman-arrow-0"><path class="feynman-diagram__arrow" d="M0,0 L8,4 L0,8 Z" /></marker><pattern height="8" width="8" patternUnits="userSpaceOnUse" id="feynman-hatch-diagonal-0"><rect height="8" width="8" y="0" x="0" class="feynman-diagram__hatch-fill" /><path d="M -2 10 L 10 -2" class="feynman-diagram__hatch-line" /></pattern><pattern height="8" width="8" patternUnits="userSpaceOnUse" id="feynman-hatch-diagonal-reverse-0"><rect height="8" width="8" y="0" x="0" class="feynman-diagram__hatch-fill" /><path d="M -2 -2 L 10 10" class="feynman-diagram__hatch-line" /></pattern><pattern height="8" width="8" patternUnits="userSpaceOnUse" id="feynman-hatch-cross-0"><rect height="8" width="8" y="0" x="0" class="feynman-diagram__hatch-fill" /><path d="M -2 10 L 10 -2" class="feynman-diagram__hatch-line" /><path d="M -2 -2 L 10 10" class="feynman-diagram__hatch-line" /></pattern><pattern height="7" width="7" patternUnits="userSpaceOnUse" id="feynman-hatch-horizontal-0"><rect height="7" width="7" y="0" x="0" class="feynman-diagram__hatch-fill" /><path d="M 0 2 L 7 2" class="feynman-diagram__hatch-line" /></pattern><pattern height="7" width="7" patternUnits="userSpaceOnUse" id="feynman-hatch-vertical-0"><rect height="7" width="7" y="0" x="0" class="feynman-diagram__hatch-fill" /><path d="M 2 0 L 2 7" class="feynman-diagram__hatch-line" /></pattern><pattern height="8" width="8" patternUnits="userSpaceOnUse" id="feynman-hatch-grid-0"><rect height="8" width="8" y="0" x="0" class="feynman-diagram__hatch-fill" /><path d="M 0 2 L 8 2" class="feynman-diagram__hatch-line" /><path d="M 2 0 L 2 8" class="feynman-diagram__hatch-line" /></pattern></defs><g class="feynman-diagram__edge-group"><path d="M 82 63.2 L 153.04 57.6" class="feynman-diagram__edg