name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --group dev
      - run: npm ci
      - name: Python tests
        run: make test-py
      - name: JavaScript tests
        run: make test-js
      - name: Check bundled renderer is up to date
        run: git diff --exit-code src/markfeyn/assets/feynman-diagrams.js
      - name: Build docs (strict)
        run: make docs
