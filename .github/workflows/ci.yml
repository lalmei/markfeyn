name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - name: Lint (3.12 only)
        if: matrix.python-version == '3.12'
        run: make lint
      - name: Python tests
        run: make test-py

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --group dev
      - run: npm ci
      - name: JavaScript tests
        run: make test-js
      - name: Check bundled renderer is up to date
        run: git diff --exit-code src/markfeyn/assets/
      - name: Build docs (strict)
        run: make docs

  package:
    needs: [python, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --group dev
      - run: npm ci
      - name: Build wheel
        run: uv build
      - name: Test bare install (no engines)
        run: |
          uv venv "$RUNNER_TEMP/bare"
          uv pip install --python "$RUNNER_TEMP/bare" dist/*.whl
          "$RUNNER_TEMP/bare/bin/python" -c "import markfeyn, markfeyn.core; assert markfeyn.core.read_bundled_asset()"
          "$RUNNER_TEMP/bare/bin/python" -m markfeyn --version
      - name: Test full install (all engines)
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" "$(ls dist/*.whl)[all]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_wheel.py" "$GITHUB_WORKSPACE/dist"
