name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # Validation only; never uploads to PyPI.

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --group dev
      - run: npm ci
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run python - <<'PY'
          import os, re, sys
          sys.path.insert(0, 'src')
          import markfeyn
          tag = os.environ['RELEASE_TAG']
          if tag:
              assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Expected regular vX.Y.Z release tag'
              assert tag == 'v' + markfeyn.__version__, 'Tag/package version mismatch'
          PY
      - run: make lint test
      - name: Verify bundled renderer
        run: |
          npm run build:js
          git diff --exit-code -- src/markfeyn/assets/
      - run: uv build
      - run: uvx --from twine twine check --strict dist/*
      - name: Smoke-test installed wheel
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" "$(ls dist/*.whl)[all]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_wheel.py" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/markfeyn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  verify-publisher:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Verify PyPI publisher without uploading
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          # Official exchange: https://docs.pypi.org/trusted-publishers/using-a-publisher/
          # Credentials remain in process memory only, never logged or saved.
          request = urllib.request.Request(
              os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=pypi',
              headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              oidc = json.load(response)['value']
          request = urllib.request.Request(
              'https://pypi.org/_/oidc/mint-token',
              data=json.dumps({'token': oidc}).encode(),
              headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f'PyPI rejected publisher authentication (HTTP {error.code}); check publisher configuration.') from None
          if not result.get('token'):
              raise SystemExit('PyPI did not return an upload credential.')
          del result, oidc, request
          print('PyPI publisher authenticated; credential discarded. Nothing uploaded.')
          PY
