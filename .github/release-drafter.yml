name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
commitish: main
filter-by-commitish: true
categories:
  - title: 'Features'
    labels: ['feature', 'enhancement']
  - title: 'Fixes'
    labels: ['fix', 'bug']
  - title: 'Documentation'
    labels: ['documentation', 'docs']
  - title: 'Maintenance'
    labels: ['maintenance', 'dependencies', 'ci']
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels: ['major']
  minor:
    labels: ['minor', 'feature', 'enhancement']
  patch:
    labels: ['patch', 'fix', 'bug']
  default: patch
exclude-labels: ['skip-changelog']
template: |
  ## Changes
  $CHANGES

  ## Release checklist
  - [ ] Match the tag to the Python package version and a green main commit.
  - [ ] Attach wheel, source distribution, and SHA256SUMS built from that exact tag.
  - [ ] Review installation instructions and known limitations.

  Release Drafter maintains notes only. It does not build artifacts, publish this draft,
  or upload a package to PyPI. Do not reuse artifacts after changing the release tag.
